<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
  

function calculate(a, b, callback) {
    return callback(a, b);
}

function addition(a, b) {
    return a + b;
}

console.log(calculate(10, 20, addition));




function greetUser(name, callback) {
    callback(name);
}

function welcome(name) {
    console.log("Welcome " + name);
}

greetUser("Akash", welcome);




function processArray(arr, callback) {
    return arr.map(callback);
}

function doubleNumber(num) {
    return num * 2;
}

console.log(processArray([1, 2, 3, 4, 5], doubleNumber));



function filterNumbers(arr, callback) {
    return arr.filter(callback);
}

function isPositive(num) {
    return num > 0;
}

console.log(filterNumbers([-5, 10, -2, 20, 0, 15], isPositive));



function findNumber(arr, callback) {
    return arr.find(callback);
}

function isEven(num) {
    return num % 2 === 0;
}

console.log(findNumber([1, 3, 7, 8, 10, 12], isEven));




function removeNegative(arr, callback) {
    return arr.filter(callback);
}

function notNegative(num) {
    return num >= 0;
}

console.log(removeNegative([-10, 20, -5, 30, -2, 40], notNegative));




function checkEligibility(age, callback) {
    callback(age);
}

function checkVote(age) {
    if (age >= 18) {
        console.log("Eligible to vote");
    } else {
        console.log("Not eligible to vote");
    }
}

checkEligibility(20, checkVote);




function orderFood(callback) {
    console.log("Order placed");

    setTimeout(function () {
        callback();
    }, 3000);
}

function foodReady() {
    console.log("Food is ready");
}

orderFood(foodReady);




function sumArray(arr, callback) {
    return callback(arr);
}

function calculateSum(arr) {
    let sum = 0;

    for (let i = 0; i < arr.length; i++) {
        sum = sum + arr[i];
    }

    return sum;
}

console.log(sumArray([10, 20, 30, 40, 50], calculateSum));




function sortArray(arr, callback) {
    return callback(arr);
}

function ascendingOrder(arr) {
    return arr.sort(function (a, b) {
        return a - b;
    });
}

console.log(sortArray([50, 20, 10, 40, 30], ascendingOrder));
</script>
</body>
</html>
