const getFactorial = (n) => {
  let fact = 1;
  for (let i = 1; i <= n; i++) {
    fact = fact * i;
  }
  return fact;
};

const checkPrime = (n) => {
  if (n <= 1) {
    return false;
  }
  for (let i = 2; i < n; i++) {
    if (n % i === 0) {
      return false;
    }
  }
  return true;
};

const checkArmstrong = (n) => {
  let str = n.toString();
  let power = str.length;
  let sum = 0;
  for (let i = 0; i < str.length; i++) {
    let digit = parseInt(str[i]);
    sum = sum + Math.pow(digit, power);
  }
  return sum === n;
};

console.log("\n=== TASK 19: Sum of Digits (1234) ===");

const task19_withoutParam = () => {
  let temp = 1234;
  let sum = 0;
  while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit;
    temp = Math.floor(temp / 10);
  }
  console.log("Without Parameter: " + sum);
};

  }
  console.log("With Parameter:    " + sum);
};

  let temp = Math.abs(num);
  let sum = 0;
  while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit;
    temp = Math.floor(temp / 10);
  }
  return sum;
};

// 20. Palindrome Check
// ==========================================
console.log("\n=== TASK 20: Check Palindrome (MALAYALAM) ===");

const task20_withoutParam = () => {
  let str = "MALAYALAM";
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    console.log("Without Parameter: MALAYALAM is Palindrome");
  } else {
    console.log("Without Parameter: MALAYALAM is Not Palindrome");
  }
};

const task20_withParam = (input) => {
  let str = input.toString().toUpperCase();
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    console.log("With Parameter:    " + input + " is Palindrome");
  } else {
    console.log("With Parameter:    " + input + " is Not Palindrome");
  }
};

const task20_withReturn = (input) => {
  let str = input.toString().toUpperCase();
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    return input + " is Palindrome";
  } else {
    return input + " is Not Palindrome";
  }
};

// Execution Task 20:
task20_withoutParam();
task20_withParam("MALAYALAM");
let result20 = task20_withReturn("MALAYALAM");
console.log("With Return:       " + result20);
