function getFactorial(n) {
  let fact = 1;
  for (let i = 1; i <= n; i++) {
    fact = fact * i;
  }
  return fact;
}

console.log(getFactorial(10));

function checkPrime(n) {
  if (n <= 1) {
    return false;
  }
  for (let i = 2; i < n; i++) {
    if (n % i === 0) {
      return false;
    }
  }
  return true;
}

function checkArmstrong(n) {
  let str = n.toString();
  let power = str.length;
  let sum = 0;
  for (let i = 0; i < str.length; i++) {
    let digit = parseInt(str[i]);
    sum = sum + Math.pow(digit, power);
  }
  return sum === n;
}

console.log("\n=== TASK 19: Sum of Digits (1234) ===");

function task19_withoutParam() {
  let temp = 1234;
  let sum = 0;
  while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit;
    temp = Math.floor(temp / 10);
  }
  console.log("Without Parameter: " + sum);
}

function task19_withParam(num) {
  let temp = Math.abs(num);
  let sum = 0;
  while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit;
    temp = Math.floor(temp / 10);
  }
  console.log("With Parameter:    " + sum);
}

function task19_withReturn(num) {
  let temp = Math.abs(num);
  let sum = 0;
  while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit;
    temp = Math.floor(temp / 10);
  }
  return sum;
}

console.log("\n=== TASK 20: Check Palindrome (MALAYALAM) ===");

function task20_withoutParam() {
  let str = "MALAYALAM";
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    console.log("Without Parameter: MALAYALAM is Palindrome");
  } else {
    console.log("Without Parameter: MALAYALAM is Not Palindrome");
  }
}

function task20_withParam(input) {
  let str = input.toString().toUpperCase();
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    console.log("With Parameter:    " + input + " is Palindrome");
  } else {
    console.log("With Parameter:    " + input + " is Not Palindrome");
  }
}

function task20_withReturn(input) {
  let str = input.toString().toUpperCase();
  let reversed = str.split("").reverse().join("");
  if (str === reversed) {
    return input + " is Palindrome";
  } else {
    return input + " is Not Palindrome";
  }
}

// Execution Task 20:
task20_withoutParam();

let result20 = task20_withReturn("MALAYALAM");
