<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      let a = 10;
    let b = 5;
    console.log(a + b);
    console.log(a - b);
    console.log(a * b);
    console.log(a / b);
    console.log(a % b);
    console.log(a == "10");
    console.log(a === 10);
    console.log(a > 0 && b > 0);
    console.log(a > 0 || b < 0);


    let checkNum = -7;
    if (checkNum > 0) {
        console.log("Positive");
    } else if (checkNum < 0) {
        console.log("Negative");
    } else {
        console.log("Zero");
    }


    let day = 3;
    switch (day) {
        case 1:
            console.log("Monday");
            break;
        case 2:
            console.log("Tuesday");
            break;
        case 3:
            console.log("Wednesday");
            break;
        case 4:
            console.log("Thursday");
            break;
        case 5:
            console.log("Friday");
            break;
        case 6:
            console.log("Saturday");
            break;
        case 7:
            console.log("Sunday");
            break;
        default:
            console.log("Invalid day");
    }
</script>
</body>
</html>
